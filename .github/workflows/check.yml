name: SAS EuroBonus Check

on:
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - run: pip install -r requirements.txt

      - name: Run check
        env:
          SEATS_AERO_KEY: ${{ secrets.SEATS_AERO_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          DEDUP_WINDOW_DAYS: "30"
        run: |
          python run.py check
          # Bygg hotell-side også
          python -c "from hotels_page import render; render()"
          # Kopier til root for GitHub Pages
          cp output/dashboard.html index.html
          cp output/hotels.html hotels.html

      - name: Commit dashboard + cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html hotels.html cache/seen.db cache/last_run.json || true
          git diff --cached --quiet || git commit -m "chore: update dashboard + cache [skip ci]"
          git push || echo "nothing to push"
