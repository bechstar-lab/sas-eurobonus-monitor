<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Hotell — SAS EuroBonus Monitor</title>
<style>
  :root {
    --bg: #FAF7F2; --ink: #5C4B3A; --muted: #8a7a66;
    --line: #e5ddd0; --card: #ffffff; --gold: #b58a4e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px; background: var(--bg); color: var(--ink);
    font: 16px/1.5 Georgia, "EB Garamond", Garamond, serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-weight: 600; font-size: 28px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
  .meta a { color: var(--ink); }
  h2 {
    font-weight: 600; font-size: 14px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted);
    margin: 36px 0 14px; border-bottom: 1px solid var(--line); padding-bottom: 6px;
  }
  .empty {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 30px; text-align: center; color: var(--muted);
  }
  .booked-trip {
    background: var(--card); border: 1px solid var(--gold); border-radius: 10px;
    padding: 18px 22px; margin: 14px 0;
  }
  .booked-trip h3 {
    font: 600 18px Georgia,serif; margin: 0 0 6px; color: var(--gold);
  }
  .booked-trip .dates { color: var(--muted); margin-bottom: 14px; }
  .links { font-family: -apple-system, sans-serif; font-size: 14px; }
  .links a {
    display: inline-block; margin: 0 14px 8px 0; color: var(--ink);
    text-decoration: underline; text-decoration-color: var(--line);
  }
  .links a:hover { text-decoration-color: var(--ink); }
  .guide {
    background: var(--bg); padding: 12px 16px; border-radius: 8px; margin-top: 14px;
    font-size: 13px;
  }
  .guide h4 {
    font: 600 11px -apple-system, sans-serif; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 6px;
  }
  .guide ul { margin: 0 0 8px; padding-left: 20px; }
  .guide li { margin-bottom: 4px; }
  .guide li strong { color: var(--ink); }
  .remove-btn {
    float: right; background: transparent; border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 10px; cursor: pointer;
    font: 11px -apple-system, sans-serif; color: var(--muted);
  }
  .remove-btn:hover { color: #a3565b; border-color: #a3565b; }
</style>
<script>
  const lsKey = (k, id) => `${k}:${id}`;
  function getLs(k, id) { return localStorage.getItem(lsKey(k, id)); }
  function setLs(k, id, v) {
    if (v === null) localStorage.removeItem(lsKey(k, id));
    else localStorage.setItem(lsKey(k, id), v);
  }

  function loadBooked() {
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key.startsWith('booked_data:')) continue;
      try { out.push(JSON.parse(localStorage.getItem(key))); } catch(e){}
    }
    return out;
  }

  function unbookTrip(tripId) {
    setLs('booked', tripId, null);
    setLs('booked_data', tripId, null);
    location.reload();
  }

  // Hotell-link-byggere (klient-side, i tilfelle siden serves statisk)
  const HOTEL_CITIES = {"BKK": {"city": "Bangkok", "country": "Thailand", "lat": 13.7563, "lng": 100.5018, "ss_id": "-3414440"}, "BOS": {"city": "Boston", "country": "USA", "lat": 42.3601, "lng": -71.0589, "ss_id": "20088326"}, "EWR": {"city": "New York", "country": "USA", "lat": 40.7128, "lng": -74.006, "ss_id": "20088325"}, "HAN": {"city": "Hanoi", "country": "Vietnam", "lat": 21.0285, "lng": 105.8542, "ss_id": "-3712051"}, "HKG": {"city": "Hong Kong", "country": "Hong Kong", "lat": 22.3193, "lng": 114.1694, "ss_id": "-1353149"}, "HND": {"city": "Tokyo", "country": "Japan", "lat": 35.6762, "lng": 139.6503, "ss_id": "-246227"}, "ICN": {"city": "Seoul", "country": "South Korea", "lat": 37.5665, "lng": 126.978, "ss_id": "-716985"}, "JFK": {"city": "New York", "country": "USA", "lat": 40.7128, "lng": -74.006, "ss_id": "20088325"}, "LAX": {"city": "Los Angeles", "country": "USA", "lat": 34.0522, "lng": -118.2437, "ss_id": "20014181"}, "MIA": {"city": "Miami", "country": "USA", "lat": 25.7617, "lng": -80.1918, "ss_id": "20023181"}, "NRT": {"city": "Tokyo", "country": "Japan", "lat": 35.6762, "lng": 139.6503, "ss_id": "-246227"}, "ORD": {"city": "Chicago", "country": "USA", "lat": 41.8781, "lng": -87.6298, "ss_id": "20066676"}, "SCL": {"city": "Santiago", "country": "Chile", "lat": -33.4489, "lng": -70.6693, "ss_id": "-986741"}, "SFO": {"city": "San Francisco", "country": "USA", "lat": 37.7749, "lng": -122.4194, "ss_id": "20015732"}, "SGN": {"city": "Ho Chi Minh City", "country": "Vietnam", "lat": 10.8231, "lng": 106.6297, "ss_id": "-3730078"}, "SIN": {"city": "Singapore", "country": "Singapore", "lat": 1.3521, "lng": 103.8198, "ss_id": "-73635"}};
  function bookingLink(airport, ci, co) {
    const c = HOTEL_CITIES[airport] || {city: airport, ss_id: ''};
    const p = new URLSearchParams({ss: c.city, checkin: ci, checkout: co,
      group_adults: 2, no_rooms: 1, group_children: 0});
    if (c.ss_id) { p.set('dest_id', c.ss_id); p.set('dest_type', 'city'); }
    return 'https://www.booking.com/searchresults.html?' + p;
  }
  function hotelsLink(airport, ci, co) {
    const c = HOTEL_CITIES[airport] || {city: airport};
    return 'https://www.hotels.com/Hotel-Search?' + new URLSearchParams({destination: c.city, startDate: ci, endDate: co, adults: 2});
  }
  function airbnbLink(airport, ci, co) {
    const c = HOTEL_CITIES[airport] || {city: airport};
    return `https://www.airbnb.com/s/${encodeURIComponent(c.city)}/homes?` + new URLSearchParams({checkin: ci, checkout: co, adults: 2, query: c.city});
  }
  function googleLink(airport, ci, co) {
    const c = HOTEL_CITIES[airport] || {city: airport};
    return `https://www.google.com/travel/hotels/${encodeURIComponent(c.city)}?` + new URLSearchParams({q: 'hotels in ' + c.city, checkin: ci, checkout: co});
  }
  function expediaLink(airport, ci, co) {
    const c = HOTEL_CITIES[airport] || {city: airport};
    return 'https://www.expedia.com/Hotel-Search?' + new URLSearchParams({destination: c.city, startDate: ci, endDate: co, adults: 2});
  }

  document.addEventListener('DOMContentLoaded', () => {
    const trips = loadBooked();
    const container = document.getElementById('booked-list');
    const empty = document.getElementById('empty-state');
    if (!trips.length) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    trips.sort((a,b) => (a.out_date || '').localeCompare(b.out_date || ''));
    for (const t of trips) {
      const c = HOTEL_CITIES[t.dest_airport] || {city: t.dest_airport, country: ''};
      const guide = (window.GUIDES || {})[t.dest_airport] || (window.GUIDES || {})[ (HOTEL_CITIES[t.dest_airport]||{}).same_as ];
      const div = document.createElement('div');
      div.className = 'booked-trip';
      const cabinLabel = t.cabin === 'business' ? 'Business' : (t.cabin === 'premium_economy' ? 'Prem Eco' : 'Eco');
      div.innerHTML = `
        <button class="remove-btn" onclick="unbookTrip('${t.id}')">Fjern</button>
        <h3>${t.dest} — ${c.city}, ${c.country}</h3>
        <div class="dates">
          <strong>${t.out_date}</strong> → <strong>${t.ret_date}</strong>
          (${t.origin} ↔ ${t.dest_airport}, ${cabinLabel})
        </div>
        <div class="links">
          <strong style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px;">Søk hotell</strong>
          <a href="${bookingLink(t.dest_airport, t.out_date, t.ret_date)}" target="_blank">Booking.com →</a>
          <a href="${hotelsLink(t.dest_airport, t.out_date, t.ret_date)}" target="_blank">Hotels.com →</a>
          <a href="${airbnbLink(t.dest_airport, t.out_date, t.ret_date)}" target="_blank">Airbnb →</a>
          <a href="${expediaLink(t.dest_airport, t.out_date, t.ret_date)}" target="_blank">Expedia →</a>
          <a href="${googleLink(t.dest_airport, t.out_date, t.ret_date)}" target="_blank">Google Hotels →</a>
        </div>
        ${guide ? guideHtml(guide) : ''}
      `;
      container.appendChild(div);
    }
  });

  function guideHtml(g) {
    let html = '<div class="guide"><h4>Strøk å vurdere</h4><ul>';
    for (const [name, desc] of g.neighborhoods || []) {
      html += `<li><strong>${name}</strong> — ${desc}</li>`;
    }
    html += '</ul>';
    if (g.tips && g.tips.length) {
      html += '<h4>Tips</h4><ul>';
      for (const t of g.tips) html += `<li>${t}</li>`;
      html += '</ul>';
    }
    if (g.apartment_hotels && g.apartment_hotels.length) {
      html += '<h4>Aktuelle apartment-hoteller</h4><ul>';
      for (const [name, desc] of g.apartment_hotels) {
        html += `<li><strong>${name}</strong> — ${desc}</li>`;
      }
      html += '</ul>';
    }
    html += '</div>';
    return html;
  }

  window.GUIDES = {"BKK": {"neighborhoods": [["Sukhumvit (Asok/Phrom Phong)", "BTS-stasjoner, restauranter, mall \u2014 bra base"], ["Silom/Sathorn", "Business-str\u00f8k, MRT, mer rolig om kvelden"], ["Riverside (Saphan Taksin)", "Elveb\u00e5t, hoteller med utsikt \u2014 Mandarin Oriental m.m."], ["Khao San / Banglamphu", "Backpacker, gamle byen \u2014 ikke for komfort"]], "tips": ["BTS Sky Train + MRT = dekker det meste. Grab-app for taxi.", "Bedre \u00e5 bo n\u00e6r BTS-stasjon \u2014 trafikk i Bangkok er traumatisk", "Sjekk Mandarin Oriental, Capella, Rosewood \u2014 ofte tilgjengelig p\u00e5 pts"]}, "BOS": {"neighborhoods": [["Back Bay", "Sentral, g\u00e5r til alt"], ["Cambridge", "N\u00e6r Harvard/MIT"], ["Seaport", "Nytt, restauranter"]], "tips": ["Subway = T. Charlie Card for bes\u00f8kende"]}, "ICN": {"neighborhoods": [["Myeongdong", "Shopping + sentralt"], ["Gangnam", "Trendy, nightlife"], ["Hongdae", "Universitet, ung scene"], ["Itaewon", "Internasjonal, restauranter"]], "tips": ["AREX flytog ICN\u2192Seoul = 1t, billig", "T-money kort til T-bane"]}, "JFK": {"apartment_hotels": [["Mint House at 70 Pine (FiDi)", "$185+/natt, 88-93 kvm, full kj\u00f8kken, Art Deco-skyskraper. 4.66/5 (3952 reviews). 2 Michelin-restauranter i bygget (Crown Shy, SAGA). T-bane 2/3/4/5/J. Ofte beste pris/kvm-ratio."], ["Sonder One Platt (FiDi)", "Marriott Bonvoy. Studio + 1BR leiligheter, ca $200-300/natt. Mer hotell-f\u00f8lelse enn Mint."], ["Sonder Battery Park (FiDi)", "Marriott Bonvoy. Litt rolig str\u00f8k, gode views. ~$220-320/natt."], ["The Beekman, Thompson Hotel (FiDi)", "5\u2605 luksus, IKKE leiligheter \u2014 boutique rom. ~$500-700/natt. Historisk 1881-bygg, atrium-lobby. Hvis dere vil splurge."], ["AKA Wall Street", "Service apartments, 2-4 ukers fokus men kortere OK. ~$300-450/natt for 1BR."], ["AKA Times Square", "Service apartments midtown. ~$400-600/natt for 1BR. Mer sentralt enn FiDi."], ["Beekman Tower (UN-distrikt)", "Klassiske leiligheter Midtown East. ~$280-400/natt."]], "neighborhoods": [["Midtown Manhattan", "Sentralt, g\u00e5-avstand til alt \u2014 dyrt"], ["Lower East Side", "Trendy, restauranter, billigere enn Midtown"], ["Brooklyn (Williamsburg/DUMBO)", "Hipster-base, T-bane til Manhattan p\u00e5 15 min"], ["Upper West Side", "Familievennlig, n\u00e6r Central Park"], ["FiDi (Financial District)", "Stille i helger, levende p\u00e5 hverdager. Apartment-hotels her."]], "tips": ["Subway 7-day pass = ca $34 \u2192 bruk det", "Unng\u00e5 Times Square-hoteller \u2014 overpriset, lite charm", "Tipping: 18-20% restaurant, $1-2 drink, $5/dag rom"]}, "MIA": {"neighborhoods": [["South Beach", "Strand + nattliv"], ["Brickell", "Business-str\u00f8k, h\u00f8yhus"], ["Wynwood", "Street art, gallerier"]], "tips": ["Bilen er nesten obligatorisk for Florida-tur"]}, "NRT": {"neighborhoods": [["Shinjuku", "Central, mange hoteller"], ["Shibuya", "Scramble crossing, shopping"], ["Ginza", "Luxury"], ["Asakusa", "Tradisjonell"]], "tips": ["Narita Express (N\u0027EX) eller Skyliner til Tokyo sentrum", "JR Pass p\u00e5 forh\u00e5nd hvis dere reiser videre i Japan"]}, "SCL": {"neighborhoods": [["Providencia", "Trygt, restauranter, mid-range hoteller"], ["Las Condes / El Golf", "Business, luxury"], ["Bellavista", "Nightlife, kunst"]], "tips": ["Spansk hjelper. Kortbruk vanlig.", "For Falklands-tur: husk LATAM SCL\u2192MPN g\u00e5r l\u00f8rdager"]}};
</script>
</head>
<body>
<div class="wrap">
  <h1>Hotell — bookede reiser</h1>
  <p class="meta">
    <a href="/">← Tilbake til fly-monitor</a>
    · Trips du har markert som booket vises her med hotell-søk forhåndsfylt.
  </p>

  <div id="empty-state" class="empty" style="display:none;">
    Du har ingen bookede trips ennå.<br>
    Gå til <a href="/">fly-monitoren</a>, marker en trip som booket, så dukker den opp her.
  </div>

  <div id="booked-list"></div>

  <p class="meta" style="margin-top:40px;">Generert 2026-06-08 16:12 UTC</p>
</div>
</body>
</html>
